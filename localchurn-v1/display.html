<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Butterchurn Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #ececf1;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
    }

    [hidden] {
      display: none !important;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Hidden while the mouse is idle. */
    body.idle,
    body.idle #canvas {
      cursor: none;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(20, 20, 24, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    body.idle #hint {
      opacity: 0;
    }

    kbd {
      font: inherit;
      font-size: 12px;
      padding: 1px 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    #orphanMsg {
      max-width: 420px;
      margin: 20vh auto 0;
      padding: 0 16px;
      line-height: 1.5;
    }
    #orphanMsg a {
      color: #4f8cff;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hint"></div>
  <div id="orphanMsg" hidden>
    This is the display window. Open <a href="index.html">the control panel</a>,
    which opens and drives this window.
  </div>
  <script>
    var IDLE_MS = 2000;
    var hint = document.getElementById('hint');
    var idleTimer = null;

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function toggleFullscreen() {
      var root = document.documentElement;
      if (isFullscreen()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      }
    }

    function updateHint() {
      // In fullscreen the browser shows its own "Esc to exit" notice.
      hint.innerHTML = isFullscreen()
        ? '<kbd>F</kbd> or <kbd>Esc</kbd> to exit fullscreen'
        : 'Double-click or press <kbd>F</kbd> for fullscreen';
    }

    // Show the cursor and hint on activity; fade both out when idle.
    function wake() {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('idle'), IDLE_MS);
    }

    ['mousemove', 'mousedown', 'wheel', 'touchstart'].forEach((type) => {
      document.addEventListener(type, wake, { passive: true });
    });

    document.getElementById('canvas').addEventListener('dblclick', toggleFullscreen);
    document.addEventListener('keydown', (e) => {
      if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !e.altKey) {
        toggleFullscreen();
      }
    });

    ['fullscreenchange', 'webkitfullscreenchange'].forEach((type) => {
      document.addEventListener(type, () => {
        updateHint();
        // Entering fullscreen: get everything out of the way straight away.
        if (isFullscreen()) {
          clearTimeout(idleTimer);
          document.body.classList.add('idle');
        } else {
          wake();
        }
      });
    });

    updateHint();
    wake();

    // The control panel owns the audio and visualizer; hand it our canvas.
    var controlWin = null;
    try {
      controlWin = window.opener;
    } catch (e) {}

    if (controlWin && !controlWin.closed && typeof controlWin.butterchurnDisplayReady === 'function') {
      controlWin.butterchurnDisplayReady(window);
    } else {
      document.getElementById('canvas').hidden = true;
      hint.hidden = true;
      document.getElementById('orphanMsg').hidden = false;
    }
  </script>
</body>
</html>
